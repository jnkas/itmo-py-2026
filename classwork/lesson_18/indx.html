
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер привычек</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">Трекер привычек</h1>

        <div class="row mb-4">
          <div class="col-3">
            <div class="card border-primary-subtle bg-primary-subtle">
              <div class="card-body py-2"><strong>Всего задач:</strong> 1</div>
            </div>
          </div>
          <div class="col-3">
            <div class="card border-success-subtle bg-success-subtle">
              <div class="card-body py-2"><strong>Выполнено сегодня:</strong> 1</div>
            </div>
          </div>
          <div class="col-3">
            <div class="card border-info-subtle bg-info-subtle">
              <div class="card-body py-2"><strong>Процент выполнения:</strong> 100.0%</div>
            </div>
          </div>
          <div class="col-3">
            <div class="card border-warning-subtle bg-warning-subtle">
              <div class="card-body py-2"><strong>Осталось на сегодня:</strong> 0</div>
            </div>
          </div>
        </div>

        <form class="row mb-4" method="post" action="/add">
          <div class="col">
            <input class="form-control" type="text" name="title" placeholder="Например: Читать 20 минут" required>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100" type="submit">Добавить</button>
          </div>
        </form>
        
        <ul class="list-group">
            <li class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                  <strong class="text-decoration-line-through text-secondary">Читать 20 минут в день</strong>
                  <div class="small text-secondary">Создано: 2026-04-24</div>
                </div>
                <div class="d-flex gap-2">
                  <form method="post" action="/toggle/1777037857034854">
                    
                      <button class="btn btn-outline-warning btn-sm" type="submit">Снять</button>
                    
                  </form>
                  <form method="post" action="/delete/1777037857034854">
                    <button class="btn btn-outline-danger btn-sm" type="submit">Удалить</button>
                  </form>
                </div>
              </li>
          </ul>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
